<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary Meta -->
    <title>Prime Agro Biotech</title>
    <meta name="description" content="Prime Agro Biotech — রেজার খামার, কৃষি ট্রেড ও দেনা পাওনার হিসাব পোর্টাল" />
    <meta name="author" content="Prime Agro Biotech" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Force light color scheme — prevents Chrome/Edge "Force Dark Mode" flag
         from inverting colors when accessed via LAN IP on mobile devices -->
    <meta name="color-scheme" content="only light" />

    <!-- Theme colour (Android Chrome toolbar) -->
    <meta name="theme-color" content="#10b981" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Prime Agro Biotech" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152.png" />
    <link rel="apple-touch-icon" sizes="144x144" href="/icons/icon-144.png" />

    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="96x96"  href="/icons/icon-96.png" />
    <link rel="icon" type="image/png" sizes="48x48"  href="/icons/icon-48.png" />
    <link rel="shortcut icon"         href="/icons/icon-96.png" />

    <!-- Microsoft Tiles -->
    <meta name="msapplication-TileImage" content="/icons/icon-144.png" />
    <meta name="msapplication-TileColor" content="#10b981" />

    <!-- Open Graph -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://khamar.krisokbd.com/" />
    <meta property="og:title"       content="Prime Agro Biotech" />
    <meta property="og:description" content="রেজার খামার, কৃষি ট্রেড ও দেনা পাওনার হিসাব" />
    <meta property="og:image"       content="https://khamar.krisokbd.com/icons/icon-512.png" />

    <!-- Splash screens for iOS (portrait) -->
    <link rel="apple-touch-startup-image"
          media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)"
          href="/icons/icon-512.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
